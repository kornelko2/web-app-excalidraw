name: test
run-name: Test extension
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install dependencies
        run: pnpm install

      - name: Run linters
        run: pnpm lint

      - name: Run formatters
        run: pnpm format

      - name: Run type checkers
        run: pnpm check:types

      - name: Build extension
        run: pnpm build
